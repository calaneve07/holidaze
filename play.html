<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f3b2e">
<title>Holidaze Button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="theme.js"></script>
<style>
/* VOICE: one job, one giant button
   IDEA: a game-show buzzer in your hand
   PICTURE: a full-width round button that glows on your turn
   COLOUR and TYPE: pine green, cranberry live, gold warning; Archivo Black + Rubik
   LAYOUT: team bar, category, button, status */
:root{--bg:#0f3b2e;--face:#165443;--ink:#f6fbf8;--dim:#acd0c2;--live:#c8203a;--live2:#ff6b7d;--gold:#f2c14e;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.view{height:100%;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
h1{font:400 26px/1.05 'Archivo Black',sans-serif;margin:8px 0 6px}
.note{color:var(--dim);font-size:15px;margin:0 0 14px}
.list{display:grid;gap:10px;overflow:auto}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;background:var(--face);border-radius:14px;padding:8px 8px 8px 12px;border-left:8px solid var(--tc,transparent)}
.tname{font-weight:700;font-size:18px;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px}
.me{display:flex;align-items:center;gap:10px}
#pad .top{border-bottom:6px solid var(--tc,transparent);padding-bottom:10px}
.team{min-height:48px;min-width:96px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font:700 16px Rubik,sans-serif;padding:0 12px}
.team:active{background:var(--live)}
.team:disabled{background:transparent;color:var(--dim);border-style:dashed}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.me{font:400 22px/1.1 'Archivo Black',sans-serif}
.chg{min-height:44px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 15px Rubik,sans-serif;padding:0 14px}
.cat{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:var(--face);font-weight:700;font-size:18px;text-align:center;min-height:48px}
.stage{flex:1;display:grid;place-items:center;padding:16px 0}
#btn{width:min(78vw,52vh,380px);aspect-ratio:1;border-radius:50%;border:0;background:#2a6a57;color:var(--ink);font:400 clamp(28px,9vw,44px)/1.05 'Archivo Black',sans-serif;box-shadow:inset 0 -14px 0 rgba(0,0,0,.28),0 10px 0 rgba(0,0,0,.25);touch-action:manipulation;transition:background .12s,transform .06s}
#btn.live{background:var(--tc,var(--live));color:var(--tink,var(--ink));box-shadow:inset 0 -14px 0 rgba(0,0,0,.28),0 10px 0 rgba(0,0,0,.25),0 0 0 8px var(--live2),0 0 40px 10px rgba(255,107,125,.55);animation:glow 1s infinite alternate}
#btn.down{transform:translateY(6px) scale(.98)}
#btn.off{background:#20493d;color:var(--dim)}
#btn:not(.live):not(.off){border:6px solid var(--tc,transparent)}
@keyframes glow{to{box-shadow:inset 0 -14px 0 rgba(0,0,0,.28),0 10px 0 rgba(0,0,0,.25),0 0 0 12px var(--live2),0 0 60px 18px rgba(255,107,125,.7)}}
@media (prefers-reduced-motion:reduce){#btn.live{animation:none}}
.status{text-align:center;font-weight:700;font-size:20px;min-height:30px}
.time{text-align:center;color:var(--dim);font-size:16px;min-height:24px;font-variant-numeric:tabular-nums}
.flash{color:var(--gold)}
.conn{text-align:center;color:var(--dim);font-size:13px;margin-top:6px}
.htime{text-align:center;font:400 clamp(40px,14vw,64px)/1 'Archivo Black',sans-serif;font-variant-numeric:tabular-nums;margin-top:12px}
.htime.low{color:var(--gold)}
.hslots{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:12px}
.hs{background:var(--face);border-radius:12px;padding:8px;text-align:center;font-size:15px;color:var(--dim);min-height:64px;display:grid;place-items:center;gap:4px}
.hs.ok{color:var(--ink);box-shadow:0 0 0 3px var(--tc,var(--gold))}
.hs img{width:100%;max-height:18vh;object-fit:cover;border-radius:8px}
.hs b{color:var(--ink)}
.hstage{flex:1;display:grid;place-items:center;padding:10px 0;min-height:0}
#hStatus{font-size:17px;min-height:50px}
.big{width:min(74vw,38vh,340px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;padding:24px;background:var(--tc,var(--live));color:var(--tink,var(--ink));font:400 clamp(24px,8vw,38px)/1.1 'Archivo Black',sans-serif;box-shadow:inset 0 -14px 0 rgba(0,0,0,.28),0 10px 0 rgba(0,0,0,.25),0 0 0 8px rgba(255,255,255,.85);cursor:pointer}
.big.off{background:#20493d;color:var(--dim);box-shadow:inset 0 -14px 0 rgba(0,0,0,.28),0 10px 0 rgba(0,0,0,.25);pointer-events:none}
.big:focus-within{outline:4px solid var(--gold);outline-offset:4px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.retry{min-height:48px;border-radius:12px;border:0;background:var(--gold);color:#1d1500;font:700 17px Rubik,sans-serif;padding:0 18px;margin:8px auto 0;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="view" id="join">
  <h1>Holidaze Craze</h1>
  <p class="note" id="joinNote">Connecting to the game…</p>
  <div class="list" id="teams"></div>
</div>

<div class="view" id="pad" hidden>
  <div class="top"><div class="me" id="me"></div><button class="chg" id="chg">Change team</button></div>
  <div class="cat" id="cat"></div>
  <div class="stage"><button id="btn" class="off" aria-label="Buzzer">WAIT</button></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="time" id="time"></div>
  <div class="conn" id="conn"></div>
</div>

<div class="view" id="hot" hidden>
  <div class="top"><div class="me" id="me2"></div><button class="chg" id="chg2">Change team</button></div>
  <div class="cat">Holiday Hotline: send your photo</div>
  <div class="htime" id="hTime"></div>
  <div class="hslots" id="hSlots"></div>
  <div class="hstage"><label class="big off" id="hBtn"><span id="hLbl">WAIT</span><input class="vh" type="file" id="hFile" accept="image/*"></label></div>
  <div class="status" id="hStatus" aria-live="polite"></div>
  <button class="retry" id="hRetry" hidden>Send again</button>
  <div class="conn" id="conn2"></div>
</div>

<script>
{
const $ = id => document.getElementById(id);
const room = (new URLSearchParams(location.search).get("room") || "").toUpperCase().replace(/[^A-Z]/g, "");
const BROKER = "wss://broker.emqx.io:8084/mqtt";
let mq = null, state = null, flashT = null, wake = null, lastState = 0;
let myId = null;
try { myId = localStorage.getItem("hzId"); } catch (e) {}
if (!myId) { myId = "p" + Math.random().toString(36).slice(2, 10); try { localStorage.setItem("hzId", myId); } catch (e) {} }
const T = x => "holidaze/" + room + "/" + x;
let myTeam = null, mySeat = null;
try { const v = localStorage.getItem("hccSeat-" + room); if (v) { myTeam = +v.slice(0, -1); mySeat = v.slice(-1); } } catch (e) {}

if (window.HZ) { const st = document.createElement("style"); st.textContent = HZ.css; document.head.appendChild(st); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function connText(t) { $("conn").textContent = t; $("conn2").textContent = t; $("joinNote").textContent = t; }
function send(m) {
  if (!mq || !mq.connected) return;
  m.id = myId;
  try { mq.publish(T("in"), JSON.stringify(m), { qos: 0 }); } catch (e) {}
}
function connect() {
  if (!room) { connText("This link is missing the game code. Scan the QR code on the TV again."); return; }
  if (!window.mqtt) { connText("Couldn't load. Check your internet connection and reload."); return; }
  connText("Step 1 of 2: reaching the game server…");
  mq = mqtt.connect(BROKER, { clientId: "hz-" + myId + "-" + Math.random().toString(16).slice(2, 6), clean: true, reconnectPeriod: 2000, connectTimeout: 8000 });
  mq.on("connect", () => {
    connText("Step 2 of 2: waiting for the game laptop (" + room + ")…");
    mq.subscribe([T("state"), T("to/" + myId)]);
    send({ t: "hello", team: myTeam, seat: mySeat });
    if (pend && pend.waiting) pushPhoto();
  });
  mq.on("reconnect", () => connText("Reconnecting…"));
  mq.on("offline", () => connText("Offline. Retrying…"));
  mq.on("error", () => connText("Connection problem. Retrying…"));
  mq.on("message", (t, buf) => {
    let d; try { d = JSON.parse(buf.toString()); } catch (e) { return; }
    if (t === T("state")) { lastState = Date.now(); onData(d); }
    else onData(d);
  });
}
function onData(d) {
  if (!d || typeof d !== "object") return;
  if (d.t === "state") { state = d; connText("Connected to game " + room + " · v6"); render(); }
  else if (d.t === "nope") flash(d.why === "partner" ? "Your partner's turn!" : "Not your turn!");
  else if (d.t === "phOk" && pend && d.pid === pend.pid) { clearTimeout(pend.timer); lastSent[pend.seat] = pend.data; pend = null; hFlash("Photo counted!"); render(); }
  else if (d.t === "phNo" && pend && d.pid === pend.pid) {
    clearTimeout(pend.timer); pend = null;
    hFlash({ closed: "The round isn't running.", have: "Your team already has that photo.", partner: "Your partner sends that one.", team: "Pick your team first.", bad: "That photo didn't work. Try another." }[d.why] || "Not accepted.");
    render();
  }
  else if (d.t === "seatTaken") { clearSeat(); joinMsg = "Someone else has that spot. Pick another."; render(); }
}
setInterval(() => {
  if (!mq || !mq.connected) return;
  send({ t: "ping", team: myTeam, seat: mySeat });
  if (state && Date.now() - lastState > 9000) connText("The game laptop isn't responding. Is the game page open on it?");
}, 4000);
function flash(t) {
  const el = $("status"); el.textContent = t; el.classList.add("flash");
  clearTimeout(flashT); flashT = setTimeout(() => { el.classList.remove("flash"); render(); }, 1200);
}
let joinMsg = "";
function clearSeat() { myTeam = null; mySeat = null; try { localStorage.removeItem("hccSeat-" + room); } catch (e) {} }
function pickSeat(i, seat) {
  myTeam = i; mySeat = seat; joinMsg = "";
  try { localStorage.setItem("hccSeat-" + room, i + seat); } catch (e) {}
  send({ t: "hello", team: i, seat });
  askWake(); render();
}
function render() {
  if (!state) return;
  const valid = myTeam != null && !!mySeat && myTeam >= 0 && myTeam < state.teams.length;
  const hot = valid && state.game === "hotline";
  $("join").hidden = valid; $("pad").hidden = !valid || hot; $("hot").hidden = !hot;
  if (hot) { renderHot(); return; }
  if (!valid) {
    $("joinNote").textContent = joinMsg || "Tap your team and spot. Partners take A and B.";
    const taken = new Set(state.taken || []);
    $("teams").innerHTML = state.teams.map((n, i) => `<div class="trow" style="--tc:${window.HZ ? HZ.color(i)[0] : "transparent"}"><div class="tname">${window.HZ ? HZ.badge(i, 32) : ""}<span>${esc(n)}</span></div>${["A", "B"].map(x => taken.has(i + x) ? `<button class="team" disabled>${x} taken</button>` : `<button class="team" data-i="${i}" data-s="${x}">Player ${x}</button>`).join("")}</div>`).join("");
    return;
  }
  $("me").innerHTML = (window.HZ ? HZ.badge(myTeam, 36) : "") + `<span>${esc(state.teams[myTeam])} · ${mySeat}</span>`;
  if (window.HZ) { const [bg, ink] = HZ.color(myTeam); document.body.style.setProperty("--tc", bg); document.body.style.setProperty("--tink", ink); }
  $("cat").textContent = state.cat || "";
  const inMatch = state.inMatch.indexOf(myTeam) >= 0;
  const teamTurn = state.active === myTeam && (state.ph === "run" || state.ph === "pause");
  const mine = teamTurn && (!state.alt || !(state.both && state.both[myTeam]) || (state.next && state.next[myTeam]) === mySeat);
  let label = "WAIT", st = "", cls = "off";
  if (!inMatch) { st = state.mode === "duel" ? "Not your match. Watch the TV." : "Not playing this round."; }
  else if (state.ph === "ready") { st = "Get ready…"; }
  else if (state.ph === "over") { st = "Round over. Watch the TV."; }
  else if (!state.alive[myTeam]) { label = "OUT"; st = "Your team is out this round."; }
  else if (mine) { label = state.ph === "pause" ? "PAUSED" : "TAP AFTER YOUR ANSWER"; st = state.ph === "pause" ? "Paused" : "Your turn!"; cls = "live"; }
  else if (teamTurn) { st = "Your partner answers this time."; cls = ""; }
  else { st = "Wait for your turn."; cls = ""; }
  const b = $("btn"); b.className = cls; b.textContent = label;
  if (!$("status").classList.contains("flash")) $("status").textContent = st;
  const tm = state.time && state.time[myTeam];
  $("time").textContent = inMatch && tm != null ? tm.toFixed(1) + " seconds left" : "";
}

$("teams").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) pickSeat(+b.dataset.i, b.dataset.s); });
["chg", "chg2"].forEach(id => $(id).addEventListener("click", () => { clearSeat(); send({ t: "hello", team: null }); render(); }));
$("btn").addEventListener("pointerdown", e => {
  e.preventDefault();
  askWake();
  const b = $("btn"); b.classList.add("down"); setTimeout(() => b.classList.remove("down"), 120);
  try { if (navigator.vibrate) navigator.vibrate(25); } catch (er) {}
  send({ t: "press" });
});
document.addEventListener("contextmenu", e => e.preventDefault());

async function askWake() {
  try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    askWake();
    if (mq && !mq.connected) { try { mq.reconnect(); } catch (e) {} }
  }
});

// ---------- Holiday Hotline: send a photo ----------
let pend = null, lastSent = {}, prevHave = null, hFlashT = null, hFlashMsg = "";
const mmss = s => { s = Math.max(0, Math.ceil(+s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
function hFlash(t) { hFlashMsg = t; clearTimeout(hFlashT); hFlashT = setTimeout(() => { hFlashMsg = ""; render(); }, 3000); render(); }
function hlOf() { return (state && state.hl) || { ph: "ready", left: 0, have: [] }; }
function haveOf() { const h = hlOf().have[myTeam]; return h ? [!!h[0], !!h[1]] : [false, false]; }
// Which slot this phone should fill next: its own, or the partner's if the partner has no phone connected.
function sendSeat() {
  const have = haveOf(), mine = mySeat === "B" ? 1 : 0, other = mySeat === "B" ? "A" : "B";
  if (!have[mine]) return mySeat;
  if (!have[1 - mine] && !(state.both && state.both[myTeam])) return other;
  return null;
}
function renderHot() {
  $("me2").innerHTML = (window.HZ ? HZ.badge(myTeam, 36) : "") + `<span>${esc(state.teams[myTeam])} · ${mySeat}</span>`;
  if (window.HZ) { const [bg, ink] = HZ.color(myTeam); document.body.style.setProperty("--tc", bg); document.body.style.setProperty("--tink", ink); }
  const hl = hlOf(), have = haveOf();
  if (hl.ph === "ready") lastSent = {};
  if (prevHave && hl.ph !== "ready") ["A", "B"].forEach((x, k) => {
    if (prevHave[k] && !have[k]) { delete lastSent[x]; hFlashMsg = x === mySeat ? "Your photo was rejected. Send a new one." : "Your partner's photo was rejected."; clearTimeout(hFlashT); hFlashT = setTimeout(() => { hFlashMsg = ""; render(); }, 4000); }
  });
  prevHave = have.slice();
  $("hTime").textContent = mmss(hl.left);
  $("hTime").classList.toggle("low", hl.ph === "run" && hl.left < 60);
  $("hSlots").innerHTML = ["A", "B"].map((x, k) => {
    const who = x === mySeat ? "You" : "Partner";
    if (have[k]) return `<div class="hs ok">${lastSent[x] ? `<img src="${lastSent[x]}" alt="">` : ""}<b>${who} (${x}): in ✓</b></div>`;
    if (pend && pend.seat === x) return `<div class="hs"><b>${who} (${x})</b>${pend.failed ? "Didn't send" : "Sending…"}</div>`;
    return `<div class="hs"><b>${who} (${x})</b>${hl.ph === "over" ? "No photo" : "Waiting"}</div>`;
  }).join("");
  let lbl, on = false, st = "";
  if (hl.ph === "ready") { lbl = "WAIT FOR THE START"; st = "Line up your friends. The TV starts the clock."; }
  else if (hl.ph === "over") { lbl = "ROUND OVER"; st = "Watch the TV for the results."; }
  else if (pend) { lbl = pend.failed ? "DIDN'T SEND" : "SENDING…"; st = pend.failed ? "It didn't go through. Check your signal and send again." : pend.waiting ? "Reconnecting, then sending…" : "Sending your photo…"; }
  else {
    const ss = sendSeat();
    if (ss) { on = true; lbl = ss === mySeat ? "SEND YOUR PHOTO" : "SEND YOUR PARTNER'S PHOTO"; st = ss === mySeat ? "Tap, then pick the photo your friend sent you." : "Your partner isn't connected, so you can send theirs too."; }
    else if (have[0] && have[1]) { lbl = "DONE! BOTH IN"; st = "Your team is finished. Watch the TV."; }
    else { lbl = "WAITING ON YOUR PARTNER"; st = "Your photo is in. Your partner sends the second one."; }
  }
  $("hBtn").classList.toggle("off", !on); $("hFile").disabled = !on; $("hLbl").textContent = lbl;
  $("hStatus").textContent = hFlashMsg || st;
  $("hStatus").classList.toggle("flash", !!hFlashMsg);
  $("hRetry").hidden = !(pend && pend.failed);
}
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const enc = (max, q) => {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", q);
    };
    let out = enc(1280, 0.72);
    if (out.length > 450000) out = enc(1000, 0.6);
    if (out.length > 450000) out = enc(800, 0.5);
    if (!out.startsWith("data:image/jpeg")) throw new Error("encode");
    return out;
  } finally { URL.revokeObjectURL(url); }
}
function pushPhoto() {
  if (!pend || !pend.data) return;
  pend.failed = false; clearTimeout(pend.timer);
  if (!mq || !mq.connected) { pend.waiting = true; pend.timer = setTimeout(() => { if (pend) { pend.failed = true; render(); } }, 30000); render(); return; }
  pend.waiting = false;
  const C = 40000, n = Math.ceil(pend.data.length / C);
  for (let i = 0; i < n; i++) {
    try { mq.publish(T("in"), JSON.stringify({ t: "ph", id: myId, pid: pend.pid, seat: pend.seat, i, n, d: pend.data.slice(i * C, (i + 1) * C) }), { qos: 1 }); } catch (e) {}
  }
  pend.timer = setTimeout(() => { if (pend) { pend.failed = true; render(); } }, 25000);
  render();
}
$("hFile").addEventListener("change", async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = "";
  if (!f || !state || pend) return;
  const seat = sendSeat(); if (!seat) return;
  pend = { pid: "x" + Math.random().toString(36).slice(2, 10), seat, data: null };
  render();
  try { pend.data = await shrink(f); }
  catch (err) { pend = null; hFlash("Couldn't open that photo. Take a screenshot of it and send the screenshot."); return; }
  pushPhoto();
});
$("hRetry").addEventListener("click", pushPhoto);

connect();
}
</script>
</body>
</html>
